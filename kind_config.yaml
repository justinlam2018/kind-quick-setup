kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

nodes:
  - role: control-plane
    extraMounts:
      - hostPath: ~/.kind-data/control-plane
        containerPath: /data
  - role: worker
    extraMounts:
      - hostPath: ~/.kind-data/worker1
        containerPath: /data
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30081
      - containerPort: 30443
        hostPort: 30441
  - role: worker
    extraMounts:
      - hostPath: ~/.kind-data/worker2
        containerPath: /data
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30082
      - containerPort: 30443
        hostPort: 30442
  - role: worker
    extraMounts:
      - hostPath: ~/.kind-data/worker3
        containerPath: /data
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30083
      - containerPort: 30443
        hostPort: 30443