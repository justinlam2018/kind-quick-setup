apiVersion: v2
name: kind-infra
description: A Helm chart for setup kind infrastructure

type: application

version: 0.1.0

appVersion: "1.16.0"

dependencies:
  - name: gateway-helm
    version: "1.8.1"
    repository: "oci://docker.io/envoyproxy"
    condition: gateway-helm.enabled
  - name: cert-manager
    version: "1.20.2"
    repository: "https://charts.jetstack.io"
    condition: cert-manager.enabled