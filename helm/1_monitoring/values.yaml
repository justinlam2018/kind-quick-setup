metrics-server:
  enabled: true
  args:
    - --kubelet-insecure-tls
kube-prometheus-stack:
  enabled: true
  prometheus:
    prometheusSpec:
      enableRemoteWriteReceiver: true
  grafana:
    additionalDataSources:
      - name: Loki
        type: loki
        uid: loki
        url: http://monitoring-loki.infra.svc.cluster.local:3100
        access: proxy
        isDefault: false
        jsonData:
          maxLines: 1000
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: custom
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
    dashboards:
      default:
        envoy-gateway-overview:
           gnetId: 24460
           revision: 1

        envoy-proxy:
          gentId: 21329
          revision: 1

    service:
      port: 3000
    persistence:
      enabled: true
    grafana.ini:
      auth:
        disable_login_form: true
      auth.anonymous:
        enabled: true
        org_role: Admin
loki:
  enabled: true
  deploymentMode: SingleBinary
  loki:
    commonConfig:
      replication_factor: 1
    auth_enabled: false
    limits_config:
      retention_period: 2d
    schemaConfig:
      configs:
        - from: 2024-04-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage:
      type: filesystem
      filesystem:
        chunks_directory: /var/loki/chunks
        rules_directory: /var/loki/rules
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 10Gi
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  # The upstream chart's canary helm test (loki-helm-test) reports missed log
  # entries whenever Loki restarts, which makes 'helm test' flaky. Our custom
  # test-loki-readwrite pod covers ingest+query without that fragility, so the
  # upstream test is disabled.
  test:
    enabled: false

k8s-monitoring:
  enabled: true
  cluster:
    name: orbstack
  destinations:
    prometheus:
      type: prometheus
      url: http://monitoring-kube-prometheus-prometheus.infra.svc.cluster.local:9090/api/v1/write
    loki:
      type: loki
      url: http://monitoring-loki.infra.svc.cluster.local:3100/loki/api/v1/push
  clusterEvents:
    enabled: true
    collector: logs-collector
  podLogsViaKubernetesApi:
    enabled: true
    collector: logs-collector
    structuredMetadata:
      pod: pod  # Set structured metadata "pod" from label "pod"
  collectors:
    metrics-collector:
      presets: [ clustered, statefulset ] # Deploys as a StatefulSet
    logs-collector:
      presets: [ filesystem-log-reader, statefulset ] # Deploys as a DaemonSet, one per node
      alloy:
        clustering:
          enabled: true

  clusterMetrics:
    enabled: true
    collector: metrics-collector # References the collector defined above
    kube-state-metrics:
      labelMatchers:
        app.kubernetes.io/name: kube-state-metrics
        namespace: infra

