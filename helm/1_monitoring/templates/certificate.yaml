apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kind-root-ca
  namespace: {{ .Release.Namespace }}
spec:
  isCA: true
  commonName: "kind-cluster-ca"
  secretName: kind-root-ca-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: envoy-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: envoy-tls
  issuerRef:
    name: ca
    kind: ClusterIssuer
  dnsNames:
    - "*.infra.kind"
    - "infra.kind"
