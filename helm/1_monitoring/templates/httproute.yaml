apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
spec:
  parentRefs:
    - name: envoy
      sectionName: http
  hostnames:
    - "*.infra.kind"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alloy-httproute
spec:
  parentRefs:
    - name: envoy
      sectionName: https
  rules:
    - backendRefs:
        - name: {{ .Release.Name | lower }}-alloy
          port: 12345
  hostnames:
    - alloy.infra.kind
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-httproute
spec:
  parentRefs:
    - name: envoy
      sectionName: https
  rules:
    - backendRefs:
        - name: {{ .Release.Name | lower }}-grafana
